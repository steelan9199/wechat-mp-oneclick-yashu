<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body {
    width: 300px;
    max-height: 560px;
    overflow-y: auto;
    margin: 0;
    padding: 14px;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #1a1a1a;
    background: #fafafa;
  }
  .head {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; margin-bottom: 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #07c160; }

  .card {
    background: #fff;
    border: 1px solid #ececec;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; font-weight: 600; margin-bottom: 2px;
  }
  .desc { font-size: 11px; color: #999; margin-bottom: 8px; }

  .row { margin-bottom: 8px; }
  .row label {
    display: block; font-size: 11px; color: #666; margin-bottom: 3px;
  }
  input {
    width: 100%; height: 28px; padding: 0 8px;
    border: 1px solid #dcdcdc; border-radius: 5px;
    font-size: 13px; outline: none; color: #1a1a1a; background: #fff;
  }
  input:focus { border-color: #07c160; box-shadow: 0 0 0 2px rgba(7,193,96,.12); }

  button {
    width: 100%; height: 30px; margin-top: 2px;
    border: 0; border-radius: 5px; background: #07c160;
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #06ad56; }
  button:disabled { background: #a8e6c3; cursor: default; }

  .status {
    display: none; margin-top: 8px; padding: 7px 8px;
    border-radius: 5px; font-size: 11px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-all;
    background: #f5f5f5; color: #333;
    max-height: 320px; overflow-y: auto;
  }
  .status.ok  { background: #eafaf1; color: #067a44; }
  .status.err { background: #fdeeee; color: #b3261e; }

  .tip { font-size: 11px; color: #999; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
  <div class="head"><span class="dot"></span>公众号一键设置</div>
  <div id="list"></div>
  <div class="tip">在公众号图文编辑页打开；执行约 15 秒，期间别关弹窗、别切标签页</div>
  <script src="popup.js"></script>
</body>
</html>
